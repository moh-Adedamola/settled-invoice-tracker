name: Scheduled jobs

# External scheduler for Settled's cron routes.
#
# Deliberately NOT Vercel Cron: there is no `crons` block in vercel.json and
# there should not be one. Keeping the schedule here means it is versioned,
# reviewable, runnable by hand, and portable if the app ever moves off Vercel.
#
# ---------------------------------------------------------------------------
# Two things about GitHub's scheduler that are worth knowing before you rely
# on it:
#
# 1. SCHEDULES ARE BEST-EFFORT, NOT GUARANTEED. Runs are queued on shared
#    infrastructure and are routinely delayed by several minutes at busy times
#    (the top of the hour is the worst). A run can also be dropped entirely
#    under heavy load. That is acceptable here only because every job below is
#    idempotent: the drain claims rows atomically and skips what is already
#    processed, reminders are protected by the (invoice_id, sequence) unique
#    constraint, and the demo reset rebuilds from scratch. A late run does the
#    same work; a missed run is picked up by the next one. Do not add a job
#    here that assumes it ran exactly once at exactly the right minute.
#
# 2. SCHEDULES ARE DISABLED AFTER 60 DAYS OF REPOSITORY INACTIVITY. GitHub
#    switches off scheduled workflows in a repo with no commits for 60 days,
#    and it emails the last committer rather than failing loudly. If cron
#    silently stops months from now, check the Actions tab for the "this
#    workflow was disabled" banner before debugging the app. Any commit
#    re-enables it.
#
# Also: schedules only ever run from the DEFAULT BRANCH (main). Editing this
# file on a branch changes nothing until it is merged.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Every 15 minutes — process-events AND dispatch-outbound. Both jobs key
    # off this one expression; the `if:` on each picks which runs.
    - cron: '*/15 * * * *'

    # ------------------------------------------------------------------------
    # THESE HOURS ARE TUNED TO A MEASURED DELAY, NOT TO THE CLOCK.
    #
    # GitHub does not deliver these slots on time. Measured from the Actions
    # API across the 8 consecutive days reset-demo ran on `0 3 * * *`:
    #
    #   delivered  07:46 07:53 07:57 07:57 08:06 08:23 08:29 08:40  UTC
    #   delay      4h46  4h53  4h57  4h57  5h06  5h23  5h29  5h40
    #   mean 5h09, min 4h46, max 5h40 — 8 for 8, never once near 03:00.
    #
    # So a nominal hour here is roughly "five hours before you want it". The
    # arithmetic for the two business-hours jobs, at UTC+1 with no DST:
    #
    #   nominal 02:00 UTC -> real 06:46-07:40 UTC = Lagos 07:46-08:40
    #   nominal 03:00 UTC -> real 07:46-08:40 UTC = Lagos 08:46-09:40
    #
    # Reminders therefore sits at 03:00, not the 08:00 that the clock would
    # suggest. 08:00 nominal would have landed near 13:00 UTC — a chasing email
    # arriving at 14:00 Lagos, which is materially worse than one at 09:00.
    #
    # THE DELAY IS BEST-EFFORT AND CAN VANISH. Nothing obliges GitHub to stay
    # late. If the queue clears, `0 3 * * *` fires at 03:00 UTC = 04:00 Lagos
    # and reminders go out in the middle of the night. That is the accepted
    # failure mode of tuning to a delay, and it is written here so the next
    # person reads it as a known trade rather than a bug.
    #
    # It is NOT guarded in the route, deliberately. A "refuse outside business
    # hours" check turns a cosmetic problem into a silent permanent one: if the
    # delay went to zero, every run would land at 04:00, refuse, and the next
    # run 24h later would land at 04:00 and refuse again. Reminders would stop
    # entirely and the route would keep returning 200. A 4am email is worse
    # than a 9am email; no email at all is worse than both. The fix if this ever
    # bites is to move the nominal hour again — the delay is measurable, which
    # is the whole reason this block exists.
    #
    # Re-measure before trusting these numbers. Any commit re-enables a
    # workflow disabled for inactivity, and the delay may well change with it.
    # ------------------------------------------------------------------------
    - cron: '0 3 * * *'   # reminders AND reset-demo

    - cron: '0 2 * * *'   # reconcile

  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: process-events
        options:
          - process-events
          - dispatch-outbound
          - reminders
          - reconcile
          - reset-demo

# The workflow reads nothing from the repository and writes nothing to it.
permissions: {}

jobs:
  process-events:
    name: Drain webhook events
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'process-events')

    # Never let two drains overlap. The drain is already safe against this —
    # rows are claimed with FOR UPDATE SKIP LOCKED — but queueing runs rather
    # than piling them up keeps the Actions tab readable.
    concurrency:
      group: cron-process-events
      cancel-in-progress: false

    steps:
      - name: Call /api/cron/process-events
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: /api/cron/process-events
        run: |
          set -euo pipefail

          # A missing secret arrives as an empty string, which would otherwise
          # produce a baffling curl error against "/api/cron/...".
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is not set. See .github/workflows/cron.yml."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set. It must match the value in the app's environment."
            exit 1
          fi

          base="${APP_URL%/}"          # tolerate a trailing slash in the secret
          url="${base}${ENDPOINT}"
          echo "POST ${url}"

          # --max-time bounds a hung request so it cannot burn the job's five
          # minutes. --retry covers transient network and cold-start failures;
          # safe to retry because the endpoint is idempotent.
          response=$(curl -sS -X POST \
            --max-time 120 \
            --retry 2 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -w '\n%{http_code}' \
            "${url}")

          body=$(printf '%s' "${response}" | sed '$d')
          code=$(printf '%s' "${response}" | tail -n 1)

          # The drain returns claimed/processed/skipped/failed counts. Worth
          # having in the log — it is the only record of what a run actually did.
          echo "HTTP ${code}"
          echo "${body}"

          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::process-events returned HTTP ${code}"
            exit 1
          fi

          # A 2xx with failures inside it is still a problem worth surfacing,
          # but not a reason to fail the run — the drain retries those itself
          # with backoff. Annotate instead.
          failed=$(printf '%s' "${body}" | grep -o '"failed":[0-9]*' | head -n1 | cut -d: -f2 || true)
          if [ -n "${failed:-}" ] && [ "${failed}" != "0" ]; then
            echo "::warning::${failed} event(s) failed and will be retried with backoff"
          fi

  # ==========================================================================
  # Everything below is live. Adding another job means three edits, not one:
  # the job here, its `cron:` line in `on.schedule`, and its entry in the
  # workflow_dispatch options list. A job wired up in fewer than three places
  # either never fires or fires as an empty run.
  # ==========================================================================

  # ==========================================================================
  # BEFORE THE FIRST LIVE SEND, READ THIS.
  #
  # dispatch-outbound and reminders are the only two jobs here that can put mail
  # in front of a client. Both rely on one filter — `is_demo = false`, applied in
  # the WHERE clause of the candidate query in lib/mail/outbound.ts — to keep
  # seeded data out of real inboxes.
  #
  # THAT FILTER HAS NEVER BEEN TESTED AGAINST LIVE DATA. Measured the day these
  # jobs were enabled:
  #
  #   clients 14 / 0 live      receipt candidates  42 unfiltered -> 0 filtered
  #   invoices 59 / 0 live     overdue candidates   7 unfiltered -> 0 filtered
  #   payments 54 / 0 live
  #
  # Every row in the database is a demo row. Those zeroes prove the filter
  # EXCLUDES demo rows. They prove nothing whatever about whether it correctly
  # INCLUDES a live one — a filter that matched nothing at all would produce an
  # identical result, and so would a typo'd column. The first real invoice is the
  # first real test of this code path, in both directions at once.
  #
  # So when the first live client is created: run dispatch-outbound by hand from
  # the Actions tab, read the counts in the response body, and confirm the
  # candidate is actually picked up. A silent zero is the failure mode to watch
  # for, and it looks exactly like today's healthy output.
  # ==========================================================================

  dispatch-outbound:
    name: Send queued outbound messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'dispatch-outbound')
    concurrency:
      group: cron-dispatch-outbound
      cancel-in-progress: false
    steps:
      - name: Call /api/cron/dispatch-outbound
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: /api/cron/dispatch-outbound
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET must both be set."
            exit 1
          fi
          base="${APP_URL%/}"
          response=$(curl -sS -X POST --max-time 120 \
            --retry 2 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -w '\n%{http_code}' "${base}${ENDPOINT}")
          body=$(printf '%s' "${response}" | sed '$d')
          code=$(printf '%s' "${response}" | tail -n 1)
          echo "HTTP ${code}"
          echo "${body}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::dispatch-outbound returned HTTP ${code}"
            exit 1
          fi

  reminders:
    name: Send invoice reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shares `0 3 * * *` with reset-demo — see the schedule block above for why
    # that hour, and why the two sharing it is harmless: reset-demo only ever
    # touches `is_demo = true` rows and this job's query excludes exactly those,
    # so they cannot see each other's work. Separate concurrency groups, and the
    # same one-expression-two-jobs shape process-events and dispatch-outbound
    # already use.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'reminders')
    concurrency:
      group: cron-reminders
      cancel-in-progress: false
    steps:
      - name: Call /api/cron/reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: /api/cron/reminders
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET must both be set."
            exit 1
          fi
          base="${APP_URL%/}"
          # Longer --max-time than the drain: this one sends email, and a
          # provider that is slow rather than down should not be abandoned
          # halfway through a batch.
          response=$(curl -sS -X POST --max-time 300 \
            --retry 1 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -w '\n%{http_code}' "${base}${ENDPOINT}")
          body=$(printf '%s' "${response}" | sed '$d')
          code=$(printf '%s' "${response}" | tail -n 1)
          echo "HTTP ${code}"
          echo "${body}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::reminders returned HTTP ${code}"
            exit 1
          fi

  reconcile:
    name: Reconcile provider balances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'reconcile')
    concurrency:
      group: cron-reconcile
      cancel-in-progress: false
    steps:
      - name: Call /api/cron/reconcile
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: /api/cron/reconcile
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET must both be set."
            exit 1
          fi
          base="${APP_URL%/}"
          response=$(curl -sS -X POST --max-time 600 \
            --retry 1 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -w '\n%{http_code}' "${base}${ENDPOINT}")
          body=$(printf '%s' "${response}" | sed '$d')
          code=$(printf '%s' "${response}" | tail -n 1)
          echo "HTTP ${code}"
          echo "${body}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::reconcile returned HTTP ${code}"
            exit 1
          fi

  reset-demo:
    name: Rebuild demo data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'reset-demo')
    concurrency:
      group: cron-reset-demo
      cancel-in-progress: false
    steps:
      - name: Call /api/cron/reset-demo
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: /api/cron/reset-demo
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is not set. See .github/workflows/cron.yml."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set. It must match the value in the app's environment."
            exit 1
          fi

          base="${APP_URL%/}"
          url="${base}${ENDPOINT}"
          echo "POST ${url}"

          # Longer --max-time than the drain: the reset purges and reinserts
          # several hundred rows. Only one retry, and only for a connection
          # failure — a reset that half-ran is not something to fire again
          # blindly, and the endpoint returns 409 rather than retrying itself
          # when it refuses to run.
          response=$(curl -sS -X POST \
            --max-time 600 \
            --retry 1 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -w '\n%{http_code}' \
            "${url}")

          body=$(printf '%s' "${response}" | sed '$d')
          code=$(printf '%s' "${response}" | tail -n 1)

          echo "HTTP ${code}"
          echo "${body}"

          # 409 means the reset refused to delete anything because live rows
          # reference demo rows. Nothing was lost, but it needs a human.
          if [ "${code}" = "409" ]; then
            echo "::error::reset-demo refused to run — live rows reference demo rows. Nothing was deleted."
            exit 1
          fi

          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::reset-demo returned HTTP ${code}"
            exit 1
          fi
